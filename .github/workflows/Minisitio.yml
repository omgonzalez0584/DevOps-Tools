name: "Deploy Minisitio"

on:
  push:
    branches:
     # - Flujo-s3

jobs:
  dev-upload-minisitio:
    name: DEV Subir Archivos ZIP Descomprimidos a S3 y hacer PR
    runs-on: ubuntu-latest
    environment: MINISITIO

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Connection
        run: |
          echo "Verificando conexión AWS DEV..."
          aws sts get-caller-identity
          echo "Verificando acceso a S3..."
          aws s3 ls s3://${{ vars.S3_BUCKET_DEV }}/ || exit 1

      - name: Download ZIP File to TMP
        run: |
          echo "Descargando archivo .zip a carpeta temporal..."
          # Descargamos fuera del workspace para que Git no lo trackee
          aws s3 cp s3://${{ vars.S3_BUCKET_DEV }}/Minisitio.zip /tmp/Minisitio.zip || exit 1
          echo "✅ Archivo .zip descargado"

      - name: Install Unzip
        run: sudo apt-get install -y unzip

      - name: Uncompress ZIP File
        run: |
          echo "Descomprimiendo el archivo .zip..."
          TMP_DIR="/tmp/minisitio_files"
          mkdir -p $TMP_DIR
          unzip /tmp/Minisitio.zip -d $TMP_DIR
          echo "✅ Archivo descomprimido"

      - name: Upload Files to S3 DEV
        run: |
          echo "📤 Subiendo archivos descomprimidos a DEV S3..."
          LOCAL_PATH="/tmp/minisitio_files/"
          # Usamos la variable directamente de vars
          S3_PATH="s3://${{ vars.S3_BUCKET_DEV }}/"

          for FILE in "$LOCAL_PATH"*; do
            if [ -f "$FILE" ]; then
              echo "⬆️ Subiendo: $(basename $FILE)"
              aws s3 cp "$FILE" "$S3_PATH$(basename $FILE)"
            fi
          done

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git for SSH
        run: |
          git config --global user.name "arfernandz17"
          git config --global user.email "afernadez1@gmail.com"
          git remote set-url origin git@github.com:${{ github.repository }}.git

      - name: Generate/Update metadata file
        run: |
          METADATA_FILE="files_metadata.txt"
          echo "Generando lista de archivos desde S3..."
          echo "Lista de archivos subidos a S3 (Actualizado: $(date))" > $METADATA_FILE
          echo "----------------------------------------------" >> $METADATA_FILE
          aws s3 ls s3://${{ vars.S3_BUCKET_DEV }}/ --recursive | awk '{print $4}' >> $METADATA_FILE
          cat $METADATA_FILE

      - name: Check for changes and Commit
        id: git_commit
        run: |
          git add files_metadata.txt
          # Verificamos si hay cambios reales en el archivo de metadatos
          if git diff --cached --quiet; then
            echo "No hay cambios en los metadatos. Saltando commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Cambios detectados. Realizando commit..."
            git commit -m "Actualizar metadatos de archivos subidos a S3"
            git push origin Flujo-s3
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git_commit.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          base: develop
          head: Flujo-s3
          title: "Actualizar metadatos de archivos del Minisitio"
          body: "Se han actualizado los metadatos de los archivos subidos a S3. Este PR fue generado automáticamente por el flujo de despliegue."
          labels: "minisitio-update"

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Eliminando archivos temporales..."
          rm -rf /tmp/minisitio_files
          rm -f /tmp/Minisitio.zip